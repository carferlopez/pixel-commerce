<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Pixel Shop</title>
  <link id="google-font" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">

  <style>
    /* ─── RESET & BASE ──────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #1a1a2e;
      --panel:        #16213e;
      --border:       #e94560;
      --text:         #eaeaea;
      --text-dim:     #888;
      --accent:       #e94560;
      --verb-bg:      #0f3460;
      --verb-hover:   #e94560;
      --inventory-bg: #0f3460;
      --font:         'Press Start 2P', monospace;
    }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: var(--font);
      cursor: none; /* usamos cursor custom */
    }

    /* ─── CURSOR CUSTOM ─────────────────────────────────────────────────── */
    #custom-cursor {
      position: fixed;
      width: 16px; height: 16px;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-2px, -2px);
      image-rendering: pixelated;
    }

    /* ─── GAME WRAPPER ──────────────────────────────────────────────────── */
    #game {
      position: relative;
      width: 800px;
      height: 600px; /* 450 escena + 150 UI inferior */
      background: var(--bg);
      border: 2px solid var(--border);
      overflow: hidden;
      image-rendering: pixelated;
    }

    /* ─── ESCENA ────────────────────────────────────────────────────────── */
    #scene {
      position: absolute;
      top: 0; left: 0;
      width: 800px; height: 450px;
      background: var(--bg);
      overflow: hidden;
    }

    #scene-bg {
      width: 100%; height: 100%;
      object-fit: cover;
      image-rendering: pixelated;
      display: block;
    }

    /* Fondo SVG placeholder cuando no hay imagen */
    #scene-bg-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ─── HOTSPOTS ──────────────────────────────────────────────────────── */
    .hotspot {
      position: absolute;
      cursor: none;
      border: 1px dashed transparent;
      transition: border-color 0.1s;
    }
    .hotspot:hover { border-color: var(--accent); }

    .hotspot-label {
      display: none;
      position: absolute;
      bottom: calc(100% + 4px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel);
      color: var(--text);
      font-family: var(--font);
      font-size: 6px;
      padding: 3px 6px;
      border: 1px solid var(--border);
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
    }
    .hotspot:hover .hotspot-label { display: block; }

    /* ─── NPC SPRITE ────────────────────────────────────────────────────── */
    #npc {
      position: absolute;
      bottom: 20px;
      right: 80px;
      width: 80px;
      height: 140px;
      cursor: none;
      image-rendering: pixelated;
    }

    #npc-sprite-placeholder {
      width: 80px; height: 140px;
    }

    /* ─── VERB BAR ──────────────────────────────────────────────────────── */
    #ui-bar {
      position: absolute;
      bottom: 0; left: 0;
      width: 800px; height: 150px;
      background: var(--verb-bg);
      border-top: 2px solid var(--border);
      display: grid;
      grid-template-columns: 1fr 220px;
    }

    #verb-section {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 12px 16px;
      gap: 8px;
    }

    #action-line {
      font-size: 7px;
      color: var(--text);
      min-height: 14px;
      letter-spacing: 0.5px;
    }

    #verb-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    .verb-btn {
      font-family: var(--font);
      font-size: 6px;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--border);
      padding: 6px 2px;
      cursor: none;
      text-align: center;
      transition: background 0.1s, color 0.1s;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }
    .verb-btn:hover  { background: var(--verb-hover); color: #fff; }
    .verb-btn.active { background: var(--accent); color: #fff; border-color: #fff; }

    /* ─── INVENTARIO ────────────────────────────────────────────────────── */
    #inventory {
      background: var(--inventory-bg);
      border-left: 2px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #inventory-title {
      font-size: 6px;
      color: var(--text-dim);
      text-align: center;
      padding: 6px;
      border-bottom: 1px solid var(--border);
      letter-spacing: 1px;
    }

    #inventory-slots {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      padding: 6px;
      flex: 1;
      overflow-y: auto;
    }

    .inv-slot {
      aspect-ratio: 1;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: none;
      position: relative;
      transition: background 0.1s;
    }
    .inv-slot:hover    { background: rgba(233,69,96,0.2); }
    .inv-slot.occupied { border-color: var(--accent); }
    .inv-slot.dragging { opacity: 0.5; }

    /* ─── DIÁLOGO ────────────────────────────────────────────────────────── */
    #dialogue-overlay {
      display: none;
      position: absolute;
      bottom: 150px; left: 0;
      width: 800px;
      background: rgba(15, 52, 96, 0.97);
      border-top: 2px solid var(--border);
      border-bottom: 2px solid var(--border);
      padding: 16px 20px;
      z-index: 100;
    }
    #dialogue-overlay.visible { display: block; }

    #dialogue-speaker {
      font-size: 7px;
      color: var(--accent);
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    #dialogue-text {
      font-size: 7px;
      color: var(--text);
      line-height: 1.8;
      margin-bottom: 12px;
      min-height: 28px;
    }

    #dialogue-choices {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .dialogue-choice {
      font-family: var(--font);
      font-size: 6px;
      color: var(--text-dim);
      background: transparent;
      border: none;
      text-align: left;
      cursor: none;
      padding: 4px 0;
      transition: color 0.1s;
    }
    .dialogue-choice::before { content: '▸ '; color: var(--accent); }
    .dialogue-choice:hover { color: var(--text); }

    /* ─── CATÁLOGO MODAL ─────────────────────────────────────────────────── */
    #catalog-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(10,10,20,0.95);
      z-index: 200;
      flex-direction: column;
      padding: 20px;
    }
    #catalog-overlay.visible { display: flex; }

    #catalog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    #catalog-title {
      font-size: 8px;
      color: var(--accent);
      letter-spacing: 2px;
    }

    #catalog-close {
      font-family: var(--font);
      font-size: 8px;
      color: var(--text-dim);
      background: transparent;
      border: 1px solid var(--border);
      padding: 6px 10px;
      cursor: none;
    }
    #catalog-close:hover { color: var(--text); border-color: var(--text); }

    #catalog-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      overflow-y: auto;
      flex: 1;
    }

    .catalog-card {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
      transition: border-color 0.15s;
    }
    .catalog-card:hover { border-color: var(--text); }
    .catalog-card.unavailable { opacity: 0.5; }

    .card-badge {
      position: absolute;
      top: 6px; right: 6px;
      font-size: 5px;
      background: var(--accent);
      color: #fff;
      padding: 2px 4px;
      letter-spacing: 0.5px;
    }

    .card-image {
      width: 100%;
      aspect-ratio: 1;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      image-rendering: pixelated;
      overflow: hidden;
    }
    .card-image img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }

    .card-name {
      font-size: 6px;
      color: var(--text);
      letter-spacing: 0.5px;
    }

    .card-desc {
      font-size: 5px;
      color: var(--text-dim);
      line-height: 1.8;
      flex: 1;
    }

    .card-price {
      font-size: 8px;
      color: var(--accent);
    }

    .card-btn {
      font-family: var(--font);
      font-size: 6px;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 7px;
      cursor: none;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: background 0.1s;
    }
    .card-btn:hover    { background: #fff; color: var(--accent); }
    .card-btn:disabled { background: var(--text-dim); cursor: none; }

    /* ─── NOTIFICACIÓN ───────────────────────────────────────────────────── */
    #notification {
      display: none;
      position: absolute;
      top: 16px; left: 50%;
      transform: translateX(-50%);
      background: var(--panel);
      border: 1px solid var(--accent);
      color: var(--text);
      font-size: 6px;
      padding: 8px 16px;
      z-index: 300;
      white-space: nowrap;
      letter-spacing: 0.5px;
    }
    #notification.visible { display: block; }
  </style>
</head>

<script>
// ═══════════════════════════════════════════════════════════════════════════
//  PIXEL COMMERCE — Motor principal
//  Todos los datos vienen de data/config.json, data/catalogue.json, data/dialogue.json
// ═══════════════════════════════════════════════════════════════════════════

const Game = (() => {

  // ── Estado ──────────────────────────────────────────────────────────────
  const state = {
    activeVerb:     'Mirar',
    inventory:      [],        // { id, emoji, name }
    dialogueNode:   null,
    config:         null,
    catalog:        null,
    dialogue:       null,
  };

  // ── Elementos DOM ────────────────────────────────────────────────────────
  const el = {
    cursor:           document.getElementById('custom-cursor'),
    actionLine:       document.getElementById('action-line'),
    verbBtns:         document.querySelectorAll('.verb-btn'),
    invSlots:         document.querySelectorAll('.inv-slot'),
    dialogueOverlay:  document.getElementById('dialogue-overlay'),
    dialogueSpeaker:  document.getElementById('dialogue-speaker'),
    dialogueText:     document.getElementById('dialogue-text'),
    dialogueChoices:  document.getElementById('dialogue-choices'),
    catalogOverlay:   document.getElementById('catalog-overlay'),
    catalogGrid:      document.getElementById('catalog-grid'),
    catalogClose:     document.getElementById('catalog-close'),
    notification:     document.getElementById('notification'),
    hotspots:         document.querySelectorAll('.hotspot'),
  };

  // ── Cursor custom ────────────────────────────────────────────────────────
  function initCursor() {
    document.addEventListener('mousemove', e => {
      el.cursor.style.left = e.clientX + 'px';
      el.cursor.style.top  = e.clientY + 'px';
    });
  }

  // ── Notificación ─────────────────────────────────────────────────────────
  let notifTimer;
  function notify(msg, ms = 2500) {
    el.notification.textContent = msg;
    el.notification.classList.add('visible');
    clearTimeout(notifTimer);
    notifTimer = setTimeout(() => el.notification.classList.remove('visible'), ms);
  }

  // ── Verb bar ─────────────────────────────────────────────────────────────
  function initVerbBar() {
    el.verbBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        state.activeVerb = btn.dataset.verb;
        el.verbBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        el.actionLine.textContent = `${state.activeVerb} …`;
      });
    });
  }

  // ── Hotspots ──────────────────────────────────────────────────────────────
  function initHotspots() {
    el.hotspots.forEach(hs => {
      hs.addEventListener('mouseenter', () => {
        el.actionLine.textContent = `${state.activeVerb} ${hs.dataset.name}`;
      });
      hs.addEventListener('mouseleave', () => {
        el.actionLine.textContent = `${state.activeVerb} …`;
      });
      hs.addEventListener('click', () => handleHotspot(hs));
    });
  }

  function handleHotspot(hs) {
    const verbs   = JSON.parse(hs.dataset.verbs);
    const verb    = state.activeVerb;
    const response = verbs[verb] ?? '';

    if (verb === 'Hablar' && response === 'talk_to_npc') {
      openDialogue(state.dialogue.start);
      return;
    }

    if (response) notify(response);
  }

  // ── Diálogo ───────────────────────────────────────────────────────────────
  function openDialogue(nodeId) {
    const node = state.dialogue.nodes[nodeId];
    if (!node) return;

    state.dialogueNode = nodeId;
    el.dialogueSpeaker.textContent = node.speaker || state.config.npc.name;
    el.dialogueText.textContent    = node.text;
    el.dialogueChoices.innerHTML   = '';

    if (node.choices && node.choices.length > 0) {
      node.choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className   = 'dialogue-choice';
        btn.textContent = choice.label;
        btn.addEventListener('click', () => advanceDialogue(choice.next));
        el.dialogueChoices.appendChild(btn);
      });
    }

    el.dialogueOverlay.classList.add('visible');

    if (node.action) handleDialogueAction(node.action);
  }

  function advanceDialogue(nextId) {
    const nextNode = state.dialogue.nodes[nextId];
    if (!nextNode) { closeDialogue(); return; }

    // Si el siguiente nodo no tiene choices => auto-avanzar tras acción
    if (nextNode.action === 'OPEN_CATALOG') {
      closeDialogue();
      setTimeout(openCatalog, 300);
      return;
    }
    if (nextNode.action === 'CLOSE_DIALOGUE') {
      closeDialogue();
      return;
    }

    openDialogue(nextId);
  }

  function handleDialogueAction(action) {
    if (action === 'OPEN_CATALOG') {
      closeDialogue();
      setTimeout(openCatalog, 300);
    }
    if (action === 'CLOSE_DIALOGUE') {
      closeDialogue();
    }
  }

  function closeDialogue() {
    el.dialogueOverlay.classList.remove('visible');
    state.dialogueNode = null;
  }

  // ── Catálogo ──────────────────────────────────────────────────────────────
  function openCatalog() {
    el.catalogOverlay.classList.add('visible');
  }

  function closeCatalog() {
    el.catalogOverlay.classList.remove('visible');
  }

  function renderCatalog() {
    el.catalogGrid.innerHTML = '';

    state.catalog.forEach(item => {
      const card = document.createElement('div');
      card.className = 'catalog-card' + (item.available ? '' : ' unavailable');

      const price = item.price.toLocaleString(
        state.config.store.locale ?? 'es-ES',
        { style: 'currency', currency: item.currency ?? 'EUR' }
      );

      const imageContent = item.image
        ? `<img src="${item.image}" alt="${item.name}">`
        : `<span style="font-size:36px;opacity:0.3">?</span>`;

      card.innerHTML = `
        ${item.badge ? `<div class="card-badge">${item.badge}</div>` : ''}
        <div class="card-image">${imageContent}</div>
        <div class="card-name">${item.name}</div>
        <div class="card-desc">${item.description}</div>
        <div class="card-price">${price}</div>
        <button class="card-btn"
          ${!item.available ? 'disabled' : ''}
          data-stripe="${item.stripeUrl}">
          ${item.available ? 'COMPRAR' : 'AGOTADO'}
        </button>
      `;

      if (item.available) {
        card.querySelector('.card-btn').addEventListener('click', () => {
          window.open(item.stripeUrl, '_blank');
        });
      }

      el.catalogGrid.appendChild(card);
    });
  }

  // ── Inventario ────────────────────────────────────────────────────────────
  function renderInventory() {
    el.invSlots.forEach((slot, i) => {
      const item = state.inventory[i];
      slot.innerHTML  = item ? item.emoji : '';
      slot.title      = item ? item.name  : '';
      slot.classList.toggle('occupied', !!item);
    });
  }

  function addToInventory(item) {
    if (state.inventory.length >= 9) { notify('Inventario lleno.'); return; }
    state.inventory.push(item);
    renderInventory();
    notify(`+ ${item.name}`);
  }

  // ── Carga de datos ────────────────────────────────────────────────────────
  async function loadJSON(path) {
    const res = await fetch(path);
    if (!res.ok) throw new Error(`No se pudo cargar ${path}`);
    return res.json();
  }

  async function loadData() {
    const [config, catalog, dialogue] = await Promise.all([
      loadJSON('data/config.json'),
      loadJSON('data/catalog.json'),
      loadJSON('data/dialogue.json'),
    ]);

    state.config   = config;
    state.catalog  = catalog;
    state.dialogue = dialogue;

    applyConfig(config);
    renderCatalog();
  }

  function applyConfig(cfg) {
    // Título
    document.title = cfg.store.name;

    // CSS vars desde config
    const root = document.documentElement.style;
    const c    = cfg.colors;
    if (c.background)   root.setProperty('--bg',            c.background);
    if (c.panel)        root.setProperty('--panel',         c.panel);
    if (c.border)       root.setProperty('--border',        c.border);
    if (c.text)         root.setProperty('--text',          c.text);
    if (c.textDim)      root.setProperty('--text-dim',      c.textDim);
    if (c.accent)       root.setProperty('--accent',        c.accent);
    if (c.verbBg)       root.setProperty('--verb-bg',       c.verbBg);
    if (c.verbHover)    root.setProperty('--verb-hover',    c.verbHover);
    if (c.inventoryBg)  root.setProperty('--inventory-bg',  c.inventoryBg);

    // Font
    if (cfg.font?.googleFontsUrl) {
      document.getElementById('google-font').href = cfg.font.googleFontsUrl;
    }

    // Nombre NPC en diálogo
    el.dialogueSpeaker.textContent = cfg.npc?.name ?? 'NPC';

    // Fondo escena (si hay imagen)
    if (cfg.scene?.backgroundImage) {
      const fallback = document.getElementById('scene-bg-fallback');
      if (fallback) {
        fallback.innerHTML = `<img id="scene-bg" src="${cfg.scene.backgroundImage}" alt="escena">`;
      }
    }
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  async function init() {
    try {
      await loadData();
    } catch (e) {
      console.warn('Error cargando datos:', e.message);
    }

    initCursor();
    initVerbBar();
    initHotspots();

    el.catalogClose.addEventListener('click', closeCatalog);

    // Cerrar diálogo con Escape
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        closeDialogue();
        closeCatalog();
      }
    });

    // Demo: seleccionar verbo "Hablar" activa el NPC directamente
    el.actionLine.textContent = 'Elige un verbo y haz click en la escena.';
  }

  return { init, addToInventory, notify };

})();

// Arrancar cuando el DOM esté listo
document.addEventListener('DOMContentLoaded', Game.init);
</script>

</body>
</html>
