<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Pixel Shop</title>
  <link id="google-font" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">

  <style>
    /* ─── RESET & BASE ──────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #1a1a2e;
      --panel:        #16213e;
      --border:       #e94560;
      --text:         #eaeaea;
      --text-dim:     #888;
      --accent:       #e94560;
      --verb-bg:      #0f3460;
      --verb-hover:   #e94560;
      --inventory-bg: #0f3460;
      --font:         'Press Start 2P', monospace;
    }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      font-family: var(--font);
      cursor: none;
    }

    /* ─── CURSOR CUSTOM ─────────────────────────────────────────────────── */
    #custom-cursor {
      position: fixed;
      width: 16px; height: 16px;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-2px, -2px);
      image-rendering: pixelated;
    }
    body.system-cursor { cursor: auto; }
    body.system-cursor #custom-cursor { display: none; }

    /* ─── GAME WRAPPER ──────────────────────────────────────────────────── */
    #game {
      position: relative;
      width: 800px; height: 600px; /* 450 escena + 150 UI */
      background: var(--bg);
      border: 2px solid var(--border);
      overflow: hidden;
      image-rendering: pixelated;
    }

    /* ─── ESCENA ────────────────────────────────────────────────────────── */
    #scene {
      position: absolute;
      top: 0; left: 0;
      width: 800px; height: 450px;
      background: var(--bg);
      overflow: hidden;
    }

    #scene-bg {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      image-rendering: pixelated;
    }

    #scene-bg-fallback {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }

    /* ─── HOTSPOTS ──────────────────────────────────────────────────────── */
    .hotspot {
      position: absolute;
      cursor: none;
      border: 1px dashed transparent;
      transition: border-color 0.1s;
    }
    .hotspot:hover { border-color: var(--accent); }

    .hotspot-label {
      display: none;
      position: absolute;
      bottom: calc(100% + 4px); left: 50%;
      transform: translateX(-50%);
      background: var(--panel);
      color: var(--text);
      font-family: var(--font);
      font-size: 6px;
      padding: 3px 6px;
      border: 1px solid var(--border);
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
    }
    .hotspot:hover .hotspot-label { display: block; }

    /* NPC sprite dentro del hotspot */
    .hotspot .npc-sprite {
      position: absolute;
      image-rendering: pixelated;
      cursor: none;
    }

    /* ─── MUTE BUTTON ───────────────────────────────────────────────────── */
    #mute-btn {
      position: absolute;
      top: 8px; right: 8px;
      width: 24px; height: 24px;
      background: transparent;
      border: none;
      padding: 0;
      cursor: none;
      z-index: 50;
      color: var(--text-dim);
      transition: color 0.1s;
    }
    #mute-btn:hover { color: var(--accent); }
    #mute-btn svg { width: 24px; height: 24px; fill: currentColor; display: block; }
    #mute-btn .icon-muted { display: none; }
    #mute-btn[data-muted="true"] .icon-sound { display: none; }
    #mute-btn[data-muted="true"] .icon-muted { display: block; }

    /* ─── VERB BAR ──────────────────────────────────────────────────────── */
    #ui-bar {
      position: absolute;
      bottom: 0; left: 0;
      width: 800px; height: 150px;
      background: var(--verb-bg);
      border-top: 2px solid var(--border);
      display: grid;
      grid-template-columns: 1fr 220px;
    }

    #verb-section {
      display: flex; flex-direction: column;
      justify-content: center;
      padding: 12px 16px; gap: 8px;
    }

    #action-line {
      font-size: 7px;
      color: var(--text);
      min-height: 14px;
      letter-spacing: 0.5px;
    }

    #verb-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    .verb-btn {
      font-family: var(--font);
      font-size: 6px;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--border);
      padding: 6px 2px;
      cursor: none;
      text-align: center;
      transition: background 0.1s, color 0.1s;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }
    .verb-btn:hover  { background: var(--verb-hover); color: #fff; }
    .verb-btn.active { background: var(--accent); color: #fff; border-color: #fff; }

    /* ─── INVENTARIO ─────────────────────────────────────────────────────
       DECISIÓN DE DISEÑO: el inventario es decorativo. En v1.0 no gestiona
       un carrito de compra — Stripe Payment Links son el carrito.
       API `Game.addToInventory(item)` disponible para extensiones de comprador.
    ────────────────────────────────────────────────────────────────────── */
    #inventory {
      background: var(--inventory-bg);
      border-left: 2px solid var(--border);
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    #inventory-title {
      font-size: 6px;
      color: var(--text-dim);
      text-align: center;
      padding: 6px;
      border-bottom: 1px solid var(--border);
      letter-spacing: 1px;
    }

    #inventory-slots {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px; padding: 6px;
      flex: 1; overflow-y: auto;
    }

    .inv-slot {
      aspect-ratio: 1;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      cursor: none;
      position: relative;
      transition: background 0.1s;
    }
    .inv-slot:hover    { background: rgba(233,69,96,0.2); }
    .inv-slot.occupied { border-color: var(--accent); }

    /* ─── DIÁLOGO ────────────────────────────────────────────────────────── */
    #dialogue-overlay {
      display: none;
      position: absolute;
      bottom: 150px; left: 0;
      width: 800px;
      background: rgba(15, 52, 96, 0.97);
      border-top: 2px solid var(--border);
      border-bottom: 2px solid var(--border);
      padding: 16px 20px;
      z-index: 100;
    }
    #dialogue-overlay.visible { display: block; }

    #dialogue-speaker {
      font-size: 7px;
      color: var(--accent);
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    #dialogue-text {
      font-size: 7px;
      color: var(--text);
      line-height: 1.8;
      margin-bottom: 12px;
      min-height: 28px;
    }

    #dialogue-choices {
      display: flex; flex-direction: column; gap: 4px;
    }

    .dialogue-choice {
      font-family: var(--font);
      font-size: 6px;
      color: var(--text-dim);
      background: transparent;
      border: none;
      text-align: left;
      cursor: auto; /* sistema: los botones de diálogo necesitan cursor visible */
      padding: 4px 0;
      transition: color 0.1s;
    }
    .dialogue-choice::before { content: '▸ '; color: var(--accent); }
    .dialogue-choice:hover { color: var(--text); }

    /* ─── CATÁLOGO MODAL ─────────────────────────────────────────────────── */
    #catalog-overlay {
      display: none;
      position: absolute; inset: 0;
      background: rgba(10,10,20,0.95);
      z-index: 200;
      flex-direction: column;
      padding: 20px;
      cursor: auto; /* sistema: el catálogo es UI de e-commerce moderna */
    }
    #catalog-overlay.visible { display: flex; }

    #catalog-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    #catalog-title {
      font-size: 8px;
      color: var(--accent);
      letter-spacing: 2px;
    }

    #catalog-close {
      font-family: var(--font);
      font-size: 8px;
      color: var(--text-dim);
      background: transparent;
      border: 1px solid var(--border);
      padding: 6px 10px;
      cursor: pointer;
    }
    #catalog-close:hover { color: var(--text); border-color: var(--text); }

    #catalog-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      overflow-y: auto;
      flex: 1;
    }

    .catalog-card {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 12px;
      display: flex; flex-direction: column; gap: 6px;
      position: relative;
      transition: border-color 0.15s;
    }
    .catalog-card:hover     { border-color: var(--text); }
    .catalog-card.sold-out  { opacity: 0.55; }

    .card-badge {
      position: absolute;
      top: 6px; right: 6px;
      font-size: 5px;
      background: var(--accent);
      color: #fff;
      padding: 2px 4px;
      letter-spacing: 0.5px;
    }

    .card-image {
      width: 100%; aspect-ratio: 1;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.05);
      display: flex; align-items: center; justify-content: center;
      font-size: 32px;
      image-rendering: pixelated;
      overflow: hidden;
    }
    .card-image img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }

    .card-name  { font-size: 6px; color: var(--text); letter-spacing: 0.5px; }
    .card-desc  { font-size: 5px; color: var(--text-dim); line-height: 1.8; flex: 1; }
    .card-price { font-size: 8px; color: var(--accent); }

    .card-btn {
      font-family: var(--font);
      font-size: 6px;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 7px;
      cursor: pointer;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: background 0.1s;
    }
    .card-btn:hover    { background: #fff; color: var(--accent); }
    .card-btn:disabled { background: var(--text-dim); cursor: not-allowed; }

    /* ─── NOTIFICACIÓN ───────────────────────────────────────────────────── */
    #notification {
      display: none;
      position: absolute;
      top: 16px; left: 50%;
      transform: translateX(-50%);
      background: var(--panel);
      border: 1px solid var(--accent);
      color: var(--text);
      font-size: 6px;
      padding: 8px 16px;
      z-index: 300;
      white-space: nowrap;
      letter-spacing: 0.5px;
      pointer-events: none;
    }
    #notification.visible { display: block; }
  </style>
</head>

<!-- CURSOR CUSTOM (SVG pixel art — se oculta automáticamente en modales) -->
<svg id="custom-cursor" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">

<!-- ─── GAME ──────────────────────────────────────────────────────────────── -->
<div id="game">

    <!-- Speaker icon (unmuted) -->
    <svg class="icon-sound" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
      <rect x="1" y="5" width="4" height="6"/>

    </svg>
  </button>

  <!-- ESCENA — hotspots y fondo renderizados dinámicamente por JS desde data/scene.json -->
  <div id="scene"></div>

  <!-- DIÁLOGO -->
  <div id="dialogue-overlay">
    <div id="dialogue-speaker"></div>
    <div id="dialogue-text"></div>
    <div id="dialogue-choices"></div>
  </div>

  <!-- UI BAR -->
  <div id="ui-bar">
    <div id="verb-section">
      <div id="action-line">Elige un verbo y haz click en la escena.</div>
      <div id="verb-grid">
        <button class="verb-btn active" data-verb="Mirar">Mirar</button>
        <button class="verb-btn"        data-verb="Coger">Coger</button>
        <button class="verb-btn"        data-verb="Usar">Usar</button>
        <button class="verb-btn"        data-verb="Hablar">Hablar</button>
      </div>
    </div>

    <!--
      INVENTARIO — Decorativo por diseño en v1.0.
      El inventario visual es parte de la estética SCUMM pero NO gestiona
      un carrito de compra. Stripe Payment Links son el checkout.
      La API Game.addToInventory({id, emoji, name}) está disponible para
      compradores avanzados que quieran extender la funcionalidad.
    -->
    <div id="inventory">
      <div id="inventory-title">INVENTARIO</div>
      <div id="inventory-slots">
        <div class="inv-slot" data-slot="0"></div>
        <div class="inv-slot" data-slot="1"></div>
        <div class="inv-slot" data-slot="2"></div>
        <div class="inv-slot" data-slot="3"></div>
        <div class="inv-slot" data-slot="4"></div>
        <div class="inv-slot" data-slot="5"></div>
        <div class="inv-slot" data-slot="6"></div>
        <div class="inv-slot" data-slot="7"></div>
        <div class="inv-slot" data-slot="8"></div>
      </div>
    </div>
  </div><!-- /#ui-bar -->

  <!-- CATÁLOGO MODAL -->
  <div id="catalog-overlay">
    <div id="catalog-header">
      <div id="catalog-title">— CATÁLOGO —</div>
      <button id="catalog-close">✕ CERRAR</button>
    </div>
    <div id="catalog-grid"></div>
  </div>

</div><!-- /#game -->

// ── AUDIO SYSTEM ──────────────────────────────────────────────────────────
const AudioSystem = (() => {
  let sounds     = {};
  let muted      = false;
  let enabled    = false;
  let ambientGo  = false; // true tras primer click en #game

  function init(cfg) {
    if (!cfg?.enabled) return;
    enabled = true;
    muted   = localStorage.getItem('pixelCommerce.muted') === 'true' || !!cfg.defaultMuted;

    sounds.click   = new Audio(cfg.click);
    sounds.notify  = new Audio(cfg.notify);
    sounds.ambient = new Audio(cfg.ambient);

    sounds.ambient.loop   = true;
    sounds.ambient.volume = cfg.ambientVolume ?? 0.3;

    // Preload (no play)
    Object.values(sounds).forEach(s => { s.load(); });

    // Primer click en #game arranca el ambient (autoplay policy)
    const gameEl = document.getElementById('game');
    const startOnce = () => {
      if (!ambientGo && !muted) {
        ambientGo = true;
        sounds.ambient.play().catch(() => {});
      }
      gameEl.removeEventListener('click', startOnce);
    };
    gameEl.addEventListener('click', startOnce);

    updateBtn();
  }

  function play(key) {
    if (!enabled || muted) return;
    const s = sounds[key];
    if (!s) return;
    try { s.currentTime = 0; s.play().catch(() => {}); } catch(e) {}
  }

  function toggleMute() {
    if (!enabled) return;
    muted = !muted;
    localStorage.setItem('pixelCommerce.muted', muted);
    if (muted) {
      Object.values(sounds).forEach(s => { try { s.pause(); } catch(e) {} });
    } else {
      if (ambientGo) sounds.ambient?.play().catch(() => {});
    }
    updateBtn();
  }

  function updateBtn() {
    const btn = document.getElementById('mute-btn');
    if (btn) btn.setAttribute('data-muted', String(muted));
  }

  return {
    init,
    click:      () => play('click'),
    notify:     () => play('notify'),
    toggleMute,
  };
})();


// ── GAME ENGINE ───────────────────────────────────────────────────────────
const Game = (() => {

  // ── Estado ──────────────────────────────────────────────────────────────
  const state = {
    activeVerb:   'Mirar',
    inventory:    [],      // { id, emoji, name }
    dialogueNode: null,
    config:       null,
    catalog:      null,
    dialogue:     null,
    scene:        null,
  };

  // ── Elementos DOM (estáticos — los hotspots son dinámicos) ───────────────
  const el = {
    cursor:          document.getElementById('custom-cursor'),
    actionLine:      document.getElementById('action-line'),
    verbBtns:        document.querySelectorAll('.verb-btn'),
    invSlots:        document.querySelectorAll('.inv-slot'),
    dialogueOverlay: document.getElementById('dialogue-overlay'),
    dialogueSpeaker: document.getElementById('dialogue-speaker'),
    dialogueText:    document.getElementById('dialogue-text'),
    dialogueChoices: document.getElementById('dialogue-choices'),
    catalogOverlay:  document.getElementById('catalog-overlay'),
    catalogGrid:     document.getElementById('catalog-grid'),
    catalogClose:    document.getElementById('catalog-close'),
    notification:    document.getElementById('notification'),
    scene:           document.getElementById('scene'),
    muteBtn:         document.getElementById('mute-btn'),
  };

  // ── Cursor custom ────────────────────────────────────────────────────────
  function initCursor() {
    document.addEventListener('mousemove', e => {
      el.cursor.style.left = e.clientX + 'px';
      el.cursor.style.top  = e.clientY + 'px';
    });
  }

  function setSystemCursor(on) {
    document.body.classList.toggle('system-cursor', on);
  }

  // ── Notificación ─────────────────────────────────────────────────────────
  let notifTimer;
  function notify(msg, ms = 2500) {
    el.notification.textContent = msg;
    el.notification.classList.add('visible');
    AudioSystem.notify();
    clearTimeout(notifTimer);
    notifTimer = setTimeout(() => el.notification.classList.remove('visible'), ms);
  }

  // ── Verb bar ─────────────────────────────────────────────────────────────
  function initVerbBar() {
    el.verbBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        AudioSystem.click();
        state.activeVerb = btn.dataset.verb;
        el.verbBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        el.actionLine.textContent = `${state.activeVerb} …`;
      });
    });
  }

  // ── Render Scene ──────────────────────────────────────────────────────────
  // Carga el fondo (PNG o SVG fallback) y crea los hotspots dinámicamente
  // desde data/scene.json. Buyer solo edita el JSON — nunca el HTML.
  async function renderScene(scene) {
    const sceneEl = el.scene;
    sceneEl.innerHTML = ''; // limpiar por si se llama de nuevo

    // 1. Background
    let bgOk = false;
    if (scene?.background?.src) {
      bgOk = await new Promise(resolve => {
        const img = document.createElement('img');
        img.id  = 'scene-bg';
        img.alt = 'escena';
        img.onload  = () => { sceneEl.appendChild(img); resolve(true); };
        img.onerror = () => resolve(false);
        img.src = scene.background.src;
      });
    }

    if (!bgOk) {
      const fallback = document.createElement('div');
      fallback.id = 'scene-bg-fallback';
      fallback.innerHTML = FALLBACK_BG_SVG;
      sceneEl.appendChild(fallback);
    }

    // 2. Hotspots
    const hotspots = scene?.hotspots ?? DEFAULTS.scene.hotspots;
    hotspots.forEach(hs => {
      const div = document.createElement('div');
      div.className     = 'hotspot';
      div.id            = `hs-${hs.id}`;
      div.dataset.name  = hs.name;
      div.dataset.verbs = JSON.stringify(hs.verbs);
      if (hs.action) div.dataset.action = hs.action;

      div.style.cssText =
        `left:${hs.rect.x}px;top:${hs.rect.y}px;` +
        `width:${hs.rect.w}px;height:${hs.rect.h}px`;

      // Label hover
      const label = document.createElement('span');
      label.className   = 'hotspot-label';
      label.textContent = hs.name;
      div.appendChild(label);

      // Sprite NPC (si está definido en scene.json)
      if (hs.sprite) {
        const img = document.createElement('img');
        img.className = 'npc-sprite';
        img.alt       = hs.name;
        img.style.cssText =
          `left:${hs.sprite.offset.x}px;top:${hs.sprite.offset.y}px;` +
          `width:${hs.sprite.width}px;height:${hs.sprite.height}px`;
        img.onerror = () => {
          // Fallback inline SVG cuando assets/npc-ada.png no existe
          const placeholder = document.createElement('div');
          placeholder.className = 'npc-sprite';
          placeholder.style.cssText =
            `left:${hs.sprite.offset.x}px;top:${hs.sprite.offset.y}px;position:absolute`;
          placeholder.innerHTML = ADA_SPRITE_SVG;
          img.replaceWith(placeholder);
        };
        img.src = hs.sprite.src; // src después de onerror
        div.appendChild(img);
      }

      sceneEl.appendChild(div);
    });
  }

  // ── Hotspots ──────────────────────────────────────────────────────────────
  // Se llama DESPUÉS de renderScene() — consulta los divs recién creados
  function initHotspots() {
    const hotspots = document.querySelectorAll('.hotspot');
    hotspots.forEach(hs => {
      hs.addEventListener('mouseenter', () => {
        el.actionLine.textContent = `${state.activeVerb} ${hs.dataset.name}`;
      });
      hs.addEventListener('mouseleave', () => {
        el.actionLine.textContent = `${state.activeVerb} …`;
      });
      hs.addEventListener('click', () => handleHotspot(hs));
    });
  }

  function handleHotspot(hs) {
    const verbs    = JSON.parse(hs.dataset.verbs);
    const verb     = state.activeVerb;
    const response = verbs[verb] ?? '';

    // Acción especial: hablar con el NPC
    if (verb === 'Hablar' && response === 'talk_to_npc') {
      openDialogue(state.dialogue.start);
      return;
    }

    // Acción de hotspot (independiente del verbo, de scene.json → action)
    const hsAction = hs.dataset.action;
    if (response) notify(response);
    if (hsAction === 'OPEN_CATALOG') {
      setTimeout(openCatalog, response ? 1200 : 0);
    }
  }

  // ── Diálogo ───────────────────────────────────────────────────────────────
  function openDialogue(nodeId) {
    const node = state.dialogue?.nodes?.[nodeId];
    if (!node) return;

    state.dialogueNode             = nodeId;
    el.dialogueSpeaker.textContent = node.speaker || state.config?.npc?.name || 'NPC';
    el.dialogueText.textContent    = node.text;
    el.dialogueChoices.innerHTML   = '';

    (node.choices || []).forEach(choice => {
      const btn       = document.createElement('button');
      btn.className   = 'dialogue-choice';
      btn.textContent = choice.label;
      btn.addEventListener('click', () => advanceDialogue(choice.next));
      el.dialogueChoices.appendChild(btn);
    });

    el.dialogueOverlay.classList.add('visible');

    if (node.action) handleDialogueAction(node.action);
  }

  function advanceDialogue(nextId) {
    const next = state.dialogue?.nodes?.[nextId];
    if (!next) { closeDialogue(); return; }

    if (next.action === 'OPEN_CATALOG') {
      closeDialogue();
      setTimeout(openCatalog, 300);
      return;
    }
    if (next.action === 'CLOSE_DIALOGUE') {
      closeDialogue();
      return;
    }

    openDialogue(nextId);
  }

  function handleDialogueAction(action) {
    if (action === 'OPEN_CATALOG')    { closeDialogue(); setTimeout(openCatalog, 300); }
    if (action === 'CLOSE_DIALOGUE')  { closeDialogue(); }
  }

  function closeDialogue() {
    el.dialogueOverlay.classList.remove('visible');
    state.dialogueNode = null;
  }

  // ── Catálogo ──────────────────────────────────────────────────────────────
  // ─────────────────────────────────────────────────────────────────────────
  // DESIGN DECISION (v1.0): One product per checkout.
  // Each catalog item links to its own Stripe Payment Link.
  // Reasons:
  //   (1) No backend required — buyers can publish on Netlify/Vercel static only.
  //   (2) Stripe Payment Links handle tax, inventory, upsells — no custom code.
  //   (3) Faster checkout = higher conversion for low-priced/impulse items.
  // For multi-item cart, see IDEAS.md (to be designed in v2.0).
  // ─────────────────────────────────────────────────────────────────────────
  function openCatalog() {
    setSystemCursor(true);
    el.catalogOverlay.classList.add('visible');
  }

  function closeCatalog() {
    setSystemCursor(false);
    el.catalogOverlay.classList.remove('visible');
  }

  function renderCatalog() {
    el.catalogGrid.innerHTML = '';
    const items   = state.catalog || [];
    const locale  = state.config?.store?.locale ?? 'es-ES';

    items.forEach(item => {
      const available = !!item.available;
      const card      = document.createElement('div');
      card.className  = 'catalog-card' + (available ? '' : ' sold-out');

      const price = (item.price ?? 0).toLocaleString(
        locale, { style: 'currency', currency: item.currency ?? 'EUR' }
      );

      const imgHtml = item.image
        ? `<img src="${item.image}" alt="${item.name}" loading="lazy">`
        : `<span style="font-size:36px;opacity:0.25">?</span>`;

      card.innerHTML = `
        ${item.badge ? `<div class="card-badge">${item.badge}</div>` : ''}
        <div class="card-image">${imgHtml}</div>
        <div class="card-name">${item.name}</div>
        <div class="card-desc">${item.description}</div>
        <div class="card-price">${price}</div>
        <button class="card-btn" ${!available ? 'disabled' : ''}>
          ${available ? 'COMPRAR' : 'AGOTADO'}
        </button>
      `;

      if (available && item.stripeUrl) {
        card.querySelector('.card-btn').addEventListener('click', () => {
          window.open(item.stripeUrl, '_blank', 'noopener');
        });
      }

      el.catalogGrid.appendChild(card);
    });
  }

  // ── Inventario ────────────────────────────────────────────────────────────
  // Decorativo — ver comentario en HTML y DESIGN DECISION en la sección Catálogo.
  // addToInventory() está disponible como API pública para extensiones.
  function renderInventory() {
    el.invSlots.forEach((slot, i) => {
      const item       = state.inventory[i];
      slot.innerHTML   = item ? item.emoji : '';
      slot.title       = item ? item.name  : '';
      slot.classList.toggle('occupied', !!item);
    });
  }

  function addToInventory(item) {
    if (state.inventory.length >= 9) { notify('Inventario lleno.'); return; }
    state.inventory.push(item);
    renderInventory();
    notify(`+ ${item.name}`);
  }

  // ── Carga de datos ────────────────────────────────────────────────────────
  async function loadJSON(path) {
    const res = await fetch(path);
    if (!res.ok) throw new Error(`${res.status} ${path}`);
    return res.json();
  }

  async function loadData() {
    // Empezar con los DEFAULTS (garantiza que el juego funciona en file://)
    state.config   = DEFAULTS.config;
    state.catalog  = DEFAULTS.catalog;
    state.dialogue = DEFAULTS.dialogue;
    state.scene    = DEFAULTS.scene;

    // Sobrescribir con los archivos externos si están disponibles (HTTP)
    try {
      const [config, catalog, dialogue, scene] = await Promise.all([
        loadJSON('data/config.json'),
        loadJSON('data/catalog.json'),
        loadJSON('data/dialogue.json'),
        loadJSON('data/scene.json'),
      ]);
      state.config   = config;
      state.catalog  = catalog;
      state.dialogue = dialogue;
      state.scene    = scene;
    } catch (e) {
      console.info(
        '[Pixel Commerce] Cargando datos por defecto.\n' +
        'Para personalizar, usa Live Server (VS Code). Ver SETUP.md.'
      );
    }

    applyConfig(state.config);
    await renderScene(state.scene);
    renderCatalog();
  }

  function applyConfig(cfg) {
    document.title = cfg.store?.name ?? 'Pixel Commerce';

    const root = document.documentElement.style;
    const c    = cfg.colors ?? {};
    if (c.background)  root.setProperty('--bg',            c.background);
    if (c.panel)       root.setProperty('--panel',         c.panel);
    if (c.border)      root.setProperty('--border',        c.border);
    if (c.text)        root.setProperty('--text',          c.text);
    if (c.textDim)     root.setProperty('--text-dim',      c.textDim);
    if (c.accent)      root.setProperty('--accent',        c.accent);
    if (c.verbBg)      root.setProperty('--verb-bg',       c.verbBg);
    if (c.verbHover)   root.setProperty('--verb-hover',    c.verbHover);
    if (c.inventoryBg) root.setProperty('--inventory-bg',  c.inventoryBg);

    const font = cfg.font ?? {};
    if (font.family) root.setProperty('--font', font.family);
    if (font.googleFontsUrl) {
      document.getElementById('google-font').href = font.googleFontsUrl;
    }

    el.dialogueSpeaker.textContent = cfg.npc?.name ?? 'NPC';

    AudioSystem.init(cfg.audio);
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  async function init() {
    await loadData(); // siempre resuelve (DEFAULTS como red de seguridad)

    initCursor();
    initVerbBar();
    initHotspots(); // después de renderScene

    el.catalogClose.addEventListener('click', closeCatalog);
    el.muteBtn.addEventListener('click', () => AudioSystem.toggleMute());

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { closeDialogue(); closeCatalog(); }
    });

    el.actionLine.textContent = 'Elige un verbo y haz click en la escena.';
  }

  return { init, addToInventory, notify };

})();

// Arrancar
document.addEventListener('DOMContentLoaded', Game.init);
</script>
